name: ${COMPOSE_PROJECT_NAME:-commerceradar}

services:
  replay-producer:
    build:
      context: .
      dockerfile: services/replay_producer/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEMA_VERSION: "${SCHEMA_VERSION:-1.0}"
      REPLAY_INPUT_PATH: ${REPLAY_INPUT_PATH:-data/samples/product_observations.v1.jsonl}
      REPLAY_INTERVAL_SECONDS: "${REPLAY_INTERVAL_SECONDS:-1}"
      REPLAY_OUTPUT: ${REPLAY_OUTPUT:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-product-observations.v1}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - commerceradar
    restart: "no"

  kafka:
    image: ${KAFKA_IMAGE:?Set KAFKA_IMAGE in .env}
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:19092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Set KAFKA_CLUSTER_ID in .env}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-3}"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - kafka:9092
        - --list
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - commerceradar
    restart: unless-stopped

networks:
  commerceradar:
    driver: bridge

volumes:
  kafka-data:
