name: ${COMPOSE_PROJECT_NAME:-commerceradar}

services:
  clickhouse:
    image: ${CLICKHOUSE_IMAGE:?Set CLICKHOUSE_IMAGE in .env}
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-commerceradar}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-commerceradar}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
    ports:
      - "127.0.0.1:${CLICKHOUSE_HTTP_PORT:-18123}:8123"
    volumes:
      - clickhouse-data:/var/lib/clickhouse
      - type: bind
        source: ./infra/clickhouse/config.xml
        target: /etc/clickhouse-server/config.d/commerceradar.xml
        read_only: true
        bind:
          create_host_path: false
    mem_limit: 2g
    cpus: 2.0
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test:
        - CMD-SHELL
        - 'clickhouse-client --user "$$CLICKHOUSE_USER" --password "$$CLICKHOUSE_PASSWORD" --query "SELECT 1"'
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - commerceradar
    restart: unless-stopped

  adafruit-collector:
    profiles:
      - ingestion
    build:
      context: .
      dockerfile: services/ingestion/Dockerfile
    environment:
      ADAFRUIT_PRODUCT_ID: "${ADAFRUIT_PRODUCT_ID:-5813}"
      ADAFRUIT_CURRENCY: "${ADAFRUIT_CURRENCY:-USD}"
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: ${KAFKA_TOPIC:-product-observations.v1}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - commerceradar
    restart: "no"

  replay-producer:
    build:
      context: .
      dockerfile: services/replay_producer/Dockerfile
    environment:
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SCHEMA_VERSION: "${SCHEMA_VERSION:-1.0}"
      REPLAY_INPUT_PATH: ${REPLAY_INPUT_PATH:-data/samples/product_observations.v1.jsonl}
      REPLAY_INTERVAL_SECONDS: "${REPLAY_INTERVAL_SECONDS:-1}"
      REPLAY_OUTPUT: ${REPLAY_OUTPUT:-kafka}
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-product-observations.v1}
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - commerceradar
    restart: "no"

  kafka:
    image: ${KAFKA_IMAGE:?Set KAFKA_IMAGE in .env}
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-19092}:19092"
    environment:
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?Set KAFKA_CLUSTER_ID in .env}
      KAFKA_NODE_ID: "1"
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:19092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-19092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_NUM_PARTITIONS: "${KAFKA_TOPIC_PARTITIONS:-3}"
      KAFKA_DEFAULT_REPLICATION_FACTOR: "1"
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: "1"
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: "1"
      KAFKA_MIN_INSYNC_REPLICAS: "1"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: "0"
      KAFKA_HEAP_OPTS: "-Xms512m -Xmx512m"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test:
        - CMD
        - /opt/kafka/bin/kafka-topics.sh
        - --bootstrap-server
        - kafka:9092
        - --list
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s
    networks:
      - commerceradar
    restart: unless-stopped


  spark-streaming:
    build:
      context: .
      dockerfile: services/streaming/Dockerfile
    entrypoint: /opt/spark/bin/spark-submit
    command:
      - --master
      - local[2]
      - --driver-memory
      - 1g
      - --conf
      - spark.jars.ivy=/ivy
      - --packages
      - org.apache.spark:spark-sql-kafka-0-10_2.12:3.5.7
      - /opt/spark/work-dir/main.py
    environment:
      KAFKA_BOOTSTRAP_SERVERS: ${KAFKA_BOOTSTRAP_SERVERS:-kafka:9092}
      KAFKA_TOPIC: ${KAFKA_TOPIC:-product-observations.v1}
      STREAM_TRIGGER: ${STREAM_TRIGGER:-available_now}
      PYTHONUNBUFFERED: "1"
      PYSPARK_PYTHON: python3
      PYSPARK_DRIVER_PYTHON: python3
      CLICKHOUSE_HTTP_URL: http://clickhouse:8123
      CLICKHOUSE_DB: ${CLICKHOUSE_DB:-commerceradar}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-commerceradar}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:?Set CLICKHOUSE_PASSWORD in .env}
    volumes:
      - spark-state:/state
      - spark-ivy:/ivy
    depends_on:
      kafka:
        condition: service_healthy
      clickhouse:
        condition: service_healthy
    networks:
      - commerceradar
    restart: "no"

  namenode:
    image: ${HADOOP_IMAGE:-apache/hadoop:3.4.1}
    hostname: namenode
    user: "0:0"
    entrypoint: /bin/bash
    command:
      - -ec
      - |
        if [ ! -f /data/name/current/VERSION ]; then
          if [ -n "$$(find /data/name -mindepth 1 -maxdepth 1 -print -quit)" ]; then
            echo "NameNode directory is not empty; refusing to format."
            exit 1
          fi
          hdfs namenode -format -nonInteractive
        fi
        exec hdfs namenode
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_HEAPSIZE_MAX: "512"
    ports:
      - "127.0.0.1:${HDFS_UI_PORT:-9870}:9870"
    volumes:
      - ./infra/hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ${HDFS_STORAGE_ROOT:?Set HDFS_STORAGE_ROOT in .env}/namenode:/data/name
      - ${COMMERCE_DATA_ROOT:?Set COMMERCE_DATA_ROOT in .env}:/external:ro
    healthcheck:
      test: ["CMD", "hdfs", "dfs", "-ls", "/"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - commerceradar
    restart: unless-stopped

  datanode:
    image: ${HADOOP_IMAGE:-apache/hadoop:3.4.1}
    hostname: datanode
    user: "0:0"
    entrypoint: /bin/bash
    command: ["-ec", "exec hdfs datanode"]
    environment:
      HADOOP_HOME: /opt/hadoop
      HADOOP_CONF_DIR: /opt/hadoop/etc/hadoop
      HADOOP_HEAPSIZE_MAX: "512"
    volumes:
      - ./infra/hdfs/core-site.xml:/opt/hadoop/etc/hadoop/core-site.xml:ro
      - ./infra/hdfs/hdfs-site.xml:/opt/hadoop/etc/hadoop/hdfs-site.xml:ro
      - ${HDFS_STORAGE_ROOT:?Set HDFS_STORAGE_ROOT in .env}/datanode:/data/data
    depends_on:
      namenode:
        condition: service_healthy
    networks:
      - commerceradar
    restart: unless-stopped

networks:
  commerceradar:
    driver: bridge

volumes:
  kafka-data:
  spark-state:
  spark-ivy:
  clickhouse-data:
